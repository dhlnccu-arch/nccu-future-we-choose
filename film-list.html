<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#082f50">
  <link rel="preload" as="image" href="assets/hero/hero-1920.webp" fetchpriority="high">
  <title>完整影展片單｜我們選擇的未來</title>
  <style>
    :root{--ink:#0d2f45;--sea:#082f50;--sea2:#123f5b;--paper:#f4f4ef;--paper2:#e9eeeb;--muted:#63727a;--line:rgba(13,47,69,.16);--white:#f7f7f2;--shadow:0 14px 38px rgba(7,38,59,.10);--gold:#9b6847}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}button,input,a{font:inherit}a{color:inherit}
    .hero{min-height:310px;padding:calc(30px + env(safe-area-inset-top,0px)) calc(clamp(22px,6vw,100px) + env(safe-area-inset-right,0px)) 42px calc(clamp(22px,6vw,100px) + env(safe-area-inset-left,0px));display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;background:#082f50 url("assets/hero/hero-1920.webp") center 47%/cover no-repeat;color:var(--white)}
    .hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,25,42,.7),rgba(3,25,42,.3) 54%,rgba(3,25,42,.18))}.hero>*{position:relative;z-index:1}.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:14px;letter-spacing:.04em}.language-switcher{display:flex;gap:20px;align-items:center}.lang-btn{border:0;background:transparent;color:rgba(247,247,242,.66);padding:10px 4px;min-width:44px;min-height:44px;cursor:pointer;border-bottom:1px solid transparent;font-weight:700}.lang-btn.active{color:#fff;border-color:#fff}.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin:0 0 14px;color:rgba(247,247,242,.72)}.hero h1{font-family:"Noto Serif TC","Source Han Serif TC","PMingLiU",serif;font-size:clamp(46px,5vw,82px);font-weight:550;line-height:1.02;margin:0}.hero p.lead{margin:14px 0 0;font-size:18px;color:rgba(247,247,242,.8)}
    .main{padding:28px clamp(18px,4.2vw,72px) 70px}.toolbar{position:sticky;top:0;z-index:20;background:rgba(244,244,239,.92);backdrop-filter:blur(14px);padding:16px 0 18px;border-bottom:1px solid var(--line)}.toolbar-row{display:grid;grid-template-columns:minmax(240px,.8fr) 2fr;gap:16px}.search{width:100%;border:1px solid var(--line);border-radius:999px;padding:14px 18px;background:#fff;color:var(--ink);outline:none}.filters{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.filter{border:1px solid var(--line);border-radius:999px;padding:12px 8px;background:rgba(255,255,255,.64);color:var(--ink);font-weight:800;cursor:pointer;line-height:1.15}.filter.active{background:var(--sea);color:#fff;border-color:var(--sea)}
    .summary{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 2px 6px;color:var(--muted);font-size:14px}.section{padding-top:28px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:18px}.section-kicker{font-size:12px;letter-spacing:.16em;color:var(--sea2);font-weight:900;margin-bottom:7px}.section-head h2{font-family:"Noto Serif TC","Source Han Serif TC","PMingLiU",serif;font-size:clamp(28px,3vw,44px);margin:0 0 5px}.section-head p{margin:0;color:var(--muted);font-size:16px}.section-total{color:var(--muted);font-weight:800;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
    .film{background:rgba(255,255,255,.88);border:1px solid rgba(13,47,69,.10);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;min-height:420px;transition:transform .2s ease}@media(hover:hover){.film:hover{transform:translateY(-3px)}}.poster{aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:linear-gradient(145deg,#0b3856,#1b566f);color:#f4f4ef;padding:22px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(13,47,69,.08)}.poster .film-mark{font-size:10px;letter-spacing:.2em;opacity:.7}.poster strong{font-family:"Noto Serif TC","Source Han Serif TC",serif;font-size:clamp(20px,2vw,30px);font-weight:500;line-height:1.35}.film h3{font-family:"Noto Serif TC","Source Han Serif TC","PMingLiU",serif;font-size:21px;line-height:1.38;margin:14px 2px 6px}.original{display:block;font:600 12px/1.5 "Noto Sans TC",sans-serif;color:var(--muted);margin-top:5px}.meta-line{color:var(--muted);font-size:13px;line-height:1.55}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0}.chip{font-size:12px;border-radius:999px;background:#e5eceb;color:#315460;padding:4px 8px;font-weight:800}.chip.level{background:#efe5db;color:#76513c}.reason{font-family:"Noto Serif TC","Source Han Serif TC",serif;color:#425c67;font-size:14px;line-height:1.68;margin:8px 0 16px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.actions{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}.action{width:100%;border:1px solid var(--sea);background:#fff;color:var(--sea);border-radius:10px;padding:11px 8px;font-weight:900;cursor:pointer;font-size:13px}
    .empty{display:none;text-align:center;padding:80px 20px;color:var(--muted);font-size:18px}.empty.show{display:block}.modal{position:fixed;inset:0;z-index:100;background:rgba(1,19,31,.76);display:none;align-items:center;justify-content:center;padding:22px}.modal.show{display:flex}.modal-card{width:min(760px,94vw);background:var(--paper);border-radius:18px;padding:24px;box-shadow:0 26px 90px rgba(0,0,0,.34)}.modal-top{display:flex;justify-content:space-between;gap:18px}.modal-top h2{font-family:"Noto Serif TC",serif;margin:0;font-size:28px;line-height:1.3}.modal-close{border:0;background:#dde6e4;border-radius:999px;width:44px;height:44px;cursor:pointer;font-size:20px}.qr-box{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:center;margin-top:20px}.qr-box img{width:100%;background:#fff;border:10px solid #fff;border-radius:12px}.modal-copy h3{margin:0 0 8px}.modal-copy p{color:var(--muted);line-height:1.65}.open-link{display:inline-block;text-decoration:none;background:var(--sea);color:#fff;border-radius:999px;padding:12px 18px;font-weight:900;margin-top:8px}.url{font-size:11px;color:var(--muted);word-break:break-all;margin-top:12px;padding:10px;background:#e9eeeb;border-radius:10px}body.kiosk-mode .open-link{display:none!important}
    @media(max-width:1150px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:900px){.toolbar-row{grid-template-columns:1fr}.filters{grid-template-columns:repeat(3,1fr)}}@media(max-width:680px){.hero{min-height:270px;padding:22px 20px 30px}.hero-top{gap:12px}.language-switcher{gap:12px}.lang-btn{font-size:13px}.main{padding:18px 14px 64px}.filters{grid-template-columns:repeat(2,1fr)}.filter{font-size:13px;padding:10px 6px}.grid{grid-template-columns:1fr}.section-head{align-items:flex-start}.section-total{display:none}.film{min-height:0}.qr-box{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.film{transition:none}}
  </style>
</head>
<body>
<header class="hero"><div class="hero-top"><a class="back" id="backLink" href="index.html">← <span id="backText">返回展覽</span></a><div class="language-switcher" aria-label="Language"><button class="lang-btn" data-lang="zh-Hant" lang="zh-Hant">中文</button><button class="lang-btn" data-lang="en" lang="en">EN</button><button class="lang-btn" data-lang="ja" lang="ja">日本語</button></div></div><div><p class="eyebrow">THE FUTURE WE CHOOSE · FILM COLLECTION</p><h1 id="pageTitle">完整影展片單</h1><p class="lead" id="pageLead">依五大展區探索本展精選影片，並查看政大圖書館館藏位置與使用方式。</p></div></header>
<main class="main"><div class="toolbar"><div class="toolbar-row"><input class="search" id="search" type="search" autocomplete="off" placeholder="搜尋片名、原文片名、索書號、館藏地…"><div class="filters" id="filters"></div></div></div><div class="summary"><span id="summaryText"></span></div><div id="content"></div><div class="empty" id="empty"></div></main>
<div class="modal" id="modal" aria-hidden="true"><div class="modal-card"><div class="modal-top"><div><div class="section-kicker" id="modalType"></div><h2 id="modalTitle"></h2></div><button class="modal-close" id="modalClose" aria-label="Close">×</button></div><div class="qr-box"><img id="modalQr" alt="QR code"><div class="modal-copy"><h3 id="modalInstruction"></h3><p id="modalBody"></p><a id="modalOpen" class="open-link" target="_blank" rel="noopener"></a><div class="url" id="modalUrl"></div></div></div></div></div>
<script src="data/films.js?v=173"></script>
<script>
const LANGS={
'zh-Hant':{query:'zh',html:'zh-Hant',filmMark:'CURATED FILM',docTitle:'完整影展片單｜我們選擇的未來',back:'返回展覽',title:'完整影展片單',lead:'依五大展區探索本展精選影片，並查看政大圖書館館藏位置與使用方式。',search:'搜尋片名、原文片名、索書號、館藏地…',all:'全部',count:'共 {n} 部影片',works:'{n} 部',empty:'找不到符合條件的影片。',catalog:'館藏連結',scan:'用手機掃描 QR Code 查看館藏',modal:'政大圖書館館藏',open:'開啟連結 ↗',modalBody:'也可使用下方按鈕直接開啟館藏頁面。',modalBodyKiosk:'展場模式請使用手機掃描 QR Code；本螢幕不會開啟外部網站。',call:'索書號',zones:{earth:['01｜失衡的地球','從氣候危機的全貌開始'],climate:['02｜當氣候來到我們身邊','極端氣候與正在改變的生活'],residents:['03｜我們不是唯一的居民','土地、水、海洋與其他生命'],consume:['04｜不能一直這樣下去','能源、消費、食物與廢棄物'],future:['05｜未來，可以不一樣','政策、行動與另一種可能']}},
en:{query:'en',html:'en',filmMark:'CURATED FILM',docTitle:'Film Selection | The Future We Choose',back:'Back to exhibition',title:'Curated Film Selection',lead:'Explore the exhibition films by theme and check NCCU Library holdings and access conditions.',search:'Search title, original title, call number, location…',all:'All',count:'{n} films',works:'{n} films',empty:'No films match your search.',catalog:'Library record',scan:'Scan the QR code for the library record',modal:'NCCU Library holding',open:'Open link ↗',modalBody:'You can also open the library record directly on this device.',modalBodyKiosk:'In exhibition mode, scan the QR code with your phone. External sites will not open on this screen.',call:'Call no.',zones:{earth:['01｜An Unbalanced Earth','Seeing the climate crisis as a connected whole'],climate:['02｜When Climate Comes Home','Extreme weather and changing everyday life'],residents:['03｜We Are Not the Only Residents','Land, water, oceans, and other forms of life'],consume:['04｜We Cannot Keep Going Like This','Energy, consumption, food, and waste'],future:['05｜Another Future Is Possible','Policy, action, and other possibilities']}},
ja:{query:'ja',html:'ja',filmMark:'映像特集',docTitle:'映像特集｜私たちが選ぶ未来',back:'展示へ戻る',title:'映像特集 全作品',lead:'5つのテーマから映像作品を探し、政治大学図書館の所蔵情報と利用条件を確認できます。',search:'作品名・原題・請求記号・所蔵場所を検索…',all:'すべて',count:'全 {n} 作品',works:'{n} 作品',empty:'条件に合う映像作品が見つかりません。',catalog:'所蔵リンク',scan:'QRコードで所蔵情報を確認',modal:'政治大学図書館 所蔵',open:'リンクを開く ↗',modalBody:'下のボタンから、この端末で直接開くこともできます。',modalBodyKiosk:'展示モードでは、スマートフォンでQRコードを読み取ってください。この画面から外部サイトは開きません。',call:'請求記号',zones:{earth:['01｜均衡を失う地球','気候危機の全体像から考える'],climate:['02｜気候が私たちの暮らしに来るとき','極端気象と変わりつつある暮らし'],residents:['03｜人間だけが住人ではない','土地、水、海、そしてほかの生命'],consume:['04｜このままでは続かない','エネルギー、消費、食、廃棄物'],future:['05｜未来は変えられる','政策、行動、そして別の可能性']}}
};
const zoneOrder=['earth','climate','residents','consume','future'];
function safeGet(k){try{return localStorage.getItem(k)}catch{return null}}function safeSet(k,v){try{localStorage.setItem(k,v)}catch{}}function kioskMode(){return new URLSearchParams(location.search).get('kiosk')==='1'}
function norm(v){v=String(v||'').trim().toLowerCase().replace('_','-');if(v==='zh'||v==='zh-tw'||v==='zh-hant'||v==='zh-hk'||v.startsWith('zh-hant'))return'zh-Hant';if(v==='en'||v.startsWith('en-'))return'en';if(v==='ja'||v==='jp'||v.startsWith('ja-'))return'ja';return null}
function initialLang(){const p=new URLSearchParams(location.search),u=norm(p.get('lang'));if(u)return u;if(kioskMode())return'zh-Hant';const st=norm(safeGet('sustainabilityLang'));if(st)return st;for(const x of(navigator.languages||[navigator.language])){const n=norm(x);if(n)return n}return'zh-Hant'}
let lang=initialLang(),filter=new URLSearchParams(location.search).get('filter')||'all',query='';if(filter!=='all'&&!zoneOrder.includes(filter))filter='all';
const content=document.getElementById('content'),empty=document.getElementById('empty');const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const fmt=(s,n)=>s.replace('{n}',n);
function withLang(path){const u=new URL(path,location.href);u.searchParams.set('lang',LANGS[lang].query);if(kioskMode())u.searchParams.set('kiosk','1');return u.pathname.split('/').pop()+u.search+u.hash}
function setLanguage(v){lang=norm(v)||'zh-Hant';if(!kioskMode())safeSet('sustainabilityLang',lang);const u=new URL(location.href);u.searchParams.set('lang',LANGS[lang].query);history.replaceState(null,'',u.pathname+u.search+u.hash);applyStatic();render()}
function applyStatic(){const u=LANGS[lang];document.body.classList.toggle('kiosk-mode',kioskMode());document.documentElement.lang=u.html;document.title=u.docTitle;document.getElementById('backText').textContent=u.back;document.getElementById('backLink').href=withLang('index.html#collection');document.getElementById('pageTitle').textContent=u.title;document.getElementById('pageLead').textContent=u.lead;document.getElementById('search').placeholder=u.search;document.getElementById('empty').textContent=u.empty;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));buildFilters()}
function buildFilters(){const u=LANGS[lang],box=document.getElementById('filters');const items=[['all',u.all],...zoneOrder.map(k=>[k,u.zones[k][0].replace(/^\d+\s*[｜|]\s*/, '')])];box.innerHTML=items.map(([k,l])=>`<button class="filter ${filter===k?'active':''}" data-filter="${k}">${esc(l)}</button>`).join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;const url=new URL(location.href);filter==='all'?url.searchParams.delete('filter'):url.searchParams.set('filter',filter);history.replaceState(null,'',url.pathname+url.search+url.hash);buildFilters();render()})}
function localizedFilm(f){if(lang==='zh-Hant')return f;const tr=f.i18n?.[lang]||{};return {...f,...tr}}
function displayInfo(f){if(lang==='zh-Hant')return{main:f.title,secondary:f.originalTitle||''};if(f.originalTitle)return{main:f.originalTitle,secondary:f.title};return{main:f.title,secondary:''}}
function searchText(f){const tr=Object.values(f.i18n||{}).flatMap(x=>Object.values(x||{}));return [f.title,f.originalTitle,f.fullTitle,f.callNumber,f.location,f.curatorialPosition,f.reason,f.pairings,...tr].filter(Boolean).join(' ').toLowerCase()}
function render(){const u=LANGS[lang],q=query.trim().toLowerCase();let html='',visible=0;zoneOrder.forEach(zone=>{if(filter!=='all'&&filter!==zone)return;const films=FILM_WORKS.filter(f=>f.zone===zone&&(!q||searchText(f).includes(q)));if(!films.length)return;visible+=films.length;const z=u.zones[zone];html+=`<section class="section"><div class="section-head"><div><div class="section-kicker">${esc(z[0])}</div><h2>${esc(z[0].replace(/^\d+\s*[｜|]\s*/,''))}</h2><p>${esc(z[1])}</p></div><div class="section-total">${esc(fmt(u.works,films.length))}</div></div><div class="grid">${films.map(renderFilm).join('')}</div></section>`});content.innerHTML=html;document.getElementById('summaryText').textContent=fmt(u.count,visible);empty.classList.toggle('show',visible===0);bindActions()}
function renderFilm(f){const u=LANGS[lang],lf=localizedFilm(f),t=displayInfo(lf);const chips=[lf.level,lf.curatorialPosition].filter(Boolean);const meta=[lf.callNumber?`${u.call} ${lf.callNumber}`:'',lf.location].filter(Boolean).join(' · ');return `<article class="film"><div class="poster"><span class="film-mark">${esc(u.filmMark)} · ${esc(lf.id)}</span><strong>${esc(t.main)}</strong></div><h3>${esc(t.main)}${t.secondary&&t.secondary!==t.main?`<span class="original">${esc(t.secondary)}</span>`:''}</h3><div class="meta-line">${esc(meta)}</div><div class="chips">${chips.map((c,i)=>`<span class="chip ${i===0?'level':''}">${esc(c)}</span>`).join('')}</div>${lf.reason?`<p class="reason">${esc(lf.reason)}</p>`:''}<div class="actions"><button class="action" data-title="${esc(t.main)}" data-url="${esc(lf.catalogUrl)}" data-qr="${esc(lf.catalogQr)}">${esc(u.catalog)}</button></div></article>`}
const modal=document.getElementById('modal');function closeModal(){modal.classList.remove('show');modal.setAttribute('aria-hidden','true')}
function bindActions(){content.querySelectorAll('.action').forEach(btn=>btn.onclick=()=>{const u=LANGS[lang],kiosk=kioskMode();document.getElementById('modalType').textContent=u.modal;document.getElementById('modalTitle').textContent=btn.dataset.title;document.getElementById('modalInstruction').textContent=u.scan;document.getElementById('modalBody').textContent=kiosk?u.modalBodyKiosk:u.modalBody;document.getElementById('modalQr').src=btn.dataset.qr;const open=document.getElementById('modalOpen');open.textContent=u.open;if(kiosk){open.removeAttribute('href');open.style.display='none'}else{open.href=btn.dataset.url;open.style.display='inline-flex'}document.getElementById('modalUrl').textContent=btn.dataset.url;modal.classList.add('show');modal.setAttribute('aria-hidden','false')})}
document.getElementById('search').addEventListener('input',e=>{query=e.target.value;render()});document.querySelectorAll('.lang-btn').forEach(b=>b.onclick=()=>setLanguage(b.dataset.lang));document.getElementById('modalClose').onclick=closeModal;modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});applyStatic();render();
</script>
</body></html>
