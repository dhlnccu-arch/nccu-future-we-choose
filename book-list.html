<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#082f50">
  <title>完整書單｜我們選擇的未來</title>
  <style>
    :root{
      --ink:#0d2f45;--sea:#082f50;--sea2:#123f5b;--paper:#f4f4ef;--paper2:#e9eeeb;
      --muted:#63727a;--line:rgba(13,47,69,.16);--online:#1d625f;--white:#f7f7f2;
      --shadow:0 14px 38px rgba(7,38,59,.10)
    }
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif} button,input,a{font:inherit} a{color:inherit}
    .hero{min-height:310px;padding:30px clamp(22px,6vw,100px) 42px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;background:#082f50 url("assets/hero/hero-1920.webp") center 47%/cover no-repeat;color:var(--white)}
    .hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,25,42,.67),rgba(3,25,42,.28) 54%,rgba(3,25,42,.18))}
    .hero>*{position:relative;z-index:1}.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:14px;letter-spacing:.04em}.language-switcher{display:flex;gap:20px;align-items:center}.lang-btn{border:0;background:transparent;color:rgba(247,247,242,.66);padding:7px 0;cursor:pointer;border-bottom:1px solid transparent;font-weight:700}.lang-btn.active{color:#fff;border-color:#fff}.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin:0 0 14px;color:rgba(247,247,242,.72)}.hero h1{font-family:"Noto Serif TC","Source Han Serif TC","PMingLiU",serif;font-size:clamp(46px,5vw,82px);font-weight:550;line-height:1.02;margin:0}.hero p.lead{margin:14px 0 0;font-size:18px;color:rgba(247,247,242,.8)}
    .main{padding:28px clamp(18px,4.2vw,72px) 70px}.toolbar{position:sticky;top:0;z-index:20;background:rgba(244,244,239,.92);backdrop-filter:blur(14px);padding:16px 0 18px;border-bottom:1px solid var(--line)}.toolbar-row{display:grid;grid-template-columns:minmax(240px,.8fr) 2fr;gap:16px}.search{width:100%;border:1px solid var(--line);border-radius:999px;padding:14px 18px;background:#fff;color:var(--ink);outline:none}.filters{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.filter{border:1px solid var(--line);border-radius:999px;padding:12px 8px;background:rgba(255,255,255,.64);color:var(--ink);font-weight:800;cursor:pointer;line-height:1.15}.filter.active{background:var(--sea);color:#fff;border-color:var(--sea)}
    .summary{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 2px 6px;color:var(--muted);font-size:14px}.section{padding-top:28px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:18px}.section-kicker{font-size:12px;letter-spacing:.16em;color:var(--sea2);font-weight:900;margin-bottom:7px}.section-head h2{font-family:"Noto Serif TC","Source Han Serif TC","PMingLiU",serif;font-size:clamp(28px,3vw,44px);margin:0 0 5px}.section-head p{margin:0;color:var(--muted);font-size:16px}.section-total{color:var(--muted);font-weight:800;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
    .book{background:rgba(255,255,255,.88);border:1px solid rgba(13,47,69,.10);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;min-height:440px;transition:transform .2s ease}.book:hover{transform:translateY(-3px)}.cover-wrap{aspect-ratio:1/1;border-radius:12px;background:#eef1ed;display:grid;place-items:center;overflow:hidden;border:1px solid rgba(13,47,69,.08);position:relative}.cover{width:100%;height:100%;object-fit:contain;background:#fff}.cover-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;text-align:center;background:linear-gradient(145deg,#0b3856,#1b566f);color:#f4f4ef;font-family:"Noto Serif TC","Source Han Serif TC",serif;font-size:20px;line-height:1.55}.cover-wrap.loaded .cover-fallback{display:none}.book h3{font-family:"Noto Serif TC","Source Han Serif TC","PMingLiU",serif;font-size:20px;line-height:1.4;margin:14px 2px 7px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.meta-line{color:var(--muted);font-size:13px;line-height:1.55;min-height:40px}.edition-chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}.chip{font-size:12px;border-radius:999px;background:#e5eceb;color:#315460;padding:4px 8px;font-weight:800}.remark{margin:8px 0 0;color:#8a6043;font-size:12px;font-weight:700}.edition-list{margin-top:auto;padding-top:12px;display:grid;gap:10px}.edition{border-top:1px solid var(--line);padding-top:10px}.edition-name{font-size:12px;color:var(--muted);font-weight:900;letter-spacing:.05em;margin-bottom:7px}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.actions.one{grid-template-columns:1fr}.action{border:1px solid var(--sea);background:#fff;color:var(--sea);border-radius:10px;padding:10px 8px;font-weight:900;cursor:pointer;font-size:13px}.action.online{background:var(--online);color:#fff;border-color:var(--online)}
    .empty{display:none;text-align:center;padding:80px 20px;color:var(--muted);font-size:18px}.empty.show{display:block}
    .modal{position:fixed;inset:0;z-index:100;background:rgba(1,19,31,.76);display:none;align-items:center;justify-content:center;padding:22px}.modal.show{display:flex}.modal-card{width:min(760px,94vw);background:var(--paper);border-radius:18px;padding:24px;box-shadow:0 26px 90px rgba(0,0,0,.34)}.modal-top{display:flex;justify-content:space-between;gap:18px}.modal-top h2{font-family:"Noto Serif TC",serif;margin:0;font-size:28px;line-height:1.3}.modal-close{border:0;background:#dde6e4;border-radius:999px;width:44px;height:44px;cursor:pointer;font-size:20px}.qr-box{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:center;margin-top:20px}.qr-box img{width:100%;background:#fff;border:10px solid #fff;border-radius:12px}.modal-copy h3{margin:0 0 8px}.modal-copy p{color:var(--muted);line-height:1.65}.open-link{display:inline-block;text-decoration:none;background:var(--sea);color:#fff;border-radius:999px;padding:12px 18px;font-weight:900;margin-top:8px}.url{font-size:11px;color:var(--muted);word-break:break-all;margin-top:12px;padding:10px;background:#e9eeeb;border-radius:10px}
    @media(max-width:1450px){.grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:1050px){.toolbar-row{grid-template-columns:1fr}.filters{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:680px){.hero{min-height:270px;padding:22px 20px 30px}.hero-top{gap:12px}.language-switcher{gap:12px}.lang-btn{font-size:13px}.main{padding:18px 14px 64px}.toolbar{top:0}.filters{grid-template-columns:repeat(2,1fr)}.filter{font-size:13px;padding:10px 6px}.grid{grid-template-columns:1fr}.section-head{align-items:flex-start}.section-total{display:none}.book{min-height:0}.qr-box{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.book{transition:none}}
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-top">
      <a class="back" id="backLink" href="index.html">← <span id="backText">返回展覽</span></a>
      <div class="language-switcher" aria-label="Language">
        <button class="lang-btn" data-lang="zh-Hant">中文</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="ja">日本語</button>
      </div>
    </div>
    <div>
      <p class="eyebrow">THE FUTURE WE CHOOSE · COLLECTION</p>
      <h1 id="pageTitle">完整書單</h1>
      <p class="lead" id="pageLead">依五大展區探索本展選書，並查看政大圖書館館藏與線上資源。</p>
    </div>
  </header>

  <main class="main">
    <div class="toolbar">
      <div class="toolbar-row">
        <input class="search" id="search" type="search" autocomplete="off" placeholder="搜尋書名、索書號、館藏地…">
        <div class="filters" id="filters"></div>
      </div>
    </div>
    <div class="summary"><span id="summaryText"></span></div>
    <div id="content"></div>
    <div class="empty" id="empty"></div>
  </main>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-top"><div><div class="section-kicker" id="modalType"></div><h2 id="modalTitle"></h2></div><button class="modal-close" id="modalClose" aria-label="Close">×</button></div>
      <div class="qr-box"><img id="modalQr" alt="QR code"><div class="modal-copy"><h3 id="modalInstruction"></h3><p id="modalBody"></p><a id="modalOpen" class="open-link" target="_blank" rel="noopener"></a><div class="url" id="modalUrl"></div></div></div>
    </div>
  </div>

  <script src="data/books.js"></script>
  <script>
    const LANGS={
      'zh-Hant':{
        query:'zh',html:'zh-Hant',docTitle:'完整書單｜我們選擇的未來',back:'返回展覽',title:'完整書單',lead:'依五大展區探索本展選書，並查看政大圖書館館藏與線上資源。',search:'搜尋書名、索書號、館藏地…',all:'全部',count:'共 {n} 部作品',works:'{n} 部作品',empty:'找不到符合條件的作品。',catalog:'館藏連結',online:'🔗 線上可獲得',zh:'中文版',en:'English Edition',ja:'日本語版',scanCatalog:'掃描 QR Code 查看館藏',scanOnline:'掃描 QR Code 使用線上資源',modalCatalog:'政大圖書館館藏',modalOnline:'線上可獲得',open:'直接開啟連結 ↗',modalBody:'也可以直接點下方按鈕，在目前裝置開啟。',cover:'BOOK',year:'年',call:'索書號',loc:'館藏地',zones:{earth:['01｜失衡的地球','從45億年氣候史，到我們正在經歷的改變'],climate:['02｜當氣候來到我們身邊','熱浪、野火、冰川與正在改變的世界'],residents:['03｜我們不是唯一的居民','土地、水、森林與其他生命'],consume:['04｜不能一直這樣下去','能源、消費、垃圾與無限成長'],future:['05｜未來，可以不一樣','政策、城市、科技與我們的下一個選擇']}},
      en:{query:'en',html:'en',docTitle:'Full Book List | The Future We Choose',back:'Back to Exhibition',title:'Full Book List',lead:'Explore the exhibition books by five themes and open NCCU Library catalog or online-access links.',search:'Search title, call number, or location…',all:'All',count:'{n} works',works:'{n} works',empty:'No matching works found.',catalog:'Catalog Link',online:'🔗 Available Online',zh:'Chinese Edition',en:'English Edition',ja:'Japanese Edition',scanCatalog:'Scan to view the catalog record',scanOnline:'Scan to use the online resource',modalCatalog:'NCCU Library Catalog',modalOnline:'Available Online',open:'Open Link ↗',modalBody:'You can also use the button below to open the link on this device.',cover:'BOOK',year:'Year',call:'Call no.',loc:'Location',zones:{earth:['01 | An Unbalanced Earth','From 4.5 billion years of climate history to the changes we are living through'],climate:['02 | When Climate Comes Home','Heat waves, wildfires, glaciers, and a changing world'],residents:['03 | We Are Not the Only Residents','Land, water, forests, and other forms of life'],consume:['04 | We Cannot Keep Going Like This','Energy, consumption, waste, and endless growth'],future:['05 | Another Future Is Possible','Policy, cities, technology, and our next choices']}},
      ja:{query:'ja',html:'ja',docTitle:'全書リスト｜私たちが選ぶ未来',back:'展示へ戻る',title:'全書リスト',lead:'5つのテーマから展示図書を探し、政治大学図書館の所蔵・オンライン資料を確認できます。',search:'書名・請求記号・所蔵場所を検索…',all:'すべて',count:'全 {n} 作品',works:'{n} 作品',empty:'条件に合う作品が見つかりません。',catalog:'所蔵リンク',online:'🔗 オンラインで利用可能',zh:'中国語版',en:'英語版',ja:'日本語版',scanCatalog:'QRコードで所蔵情報を確認',scanOnline:'QRコードでオンライン資料を利用',modalCatalog:'政治大学図書館 所蔵',modalOnline:'オンラインで利用可能',open:'リンクを開く ↗',modalBody:'下のボタンから、この端末で直接開くこともできます。',cover:'BOOK',year:'年',call:'請求記号',loc:'所蔵場所',zones:{earth:['01｜均衡を失う地球','45億年の気候史から、いま私たちが経験する変化へ'],climate:['02｜気候が私たちの暮らしに来るとき','熱波、山火事、氷河、そして変わりつつある世界'],residents:['03｜人間だけが住人ではない','土地、水、森、そしてほかの生命'],consume:['04｜このままでは続かない','エネルギー、消費、廃棄物、そして無限成長'],future:['05｜未来は変えられる','政策、都市、技術、そして私たちの次の選択']}}
    };
    const zoneOrder=['earth','climate','residents','consume','future'];
    function norm(v){v=(v||'').toLowerCase();if(['zh','zh-tw','zh-hant'].includes(v))return'zh-Hant';if(v==='en')return'en';if(['ja','jp'].includes(v))return'ja';return null}
    let lang=norm(new URLSearchParams(location.search).get('lang'))||norm(localStorage.getItem('sustainabilityLang'))||'zh-Hant';
    let filter=new URLSearchParams(location.search).get('filter')||'all'; if(filter!=='all'&&!zoneOrder.includes(filter))filter='all';
    let query='';
    const content=document.getElementById('content'), empty=document.getElementById('empty');
    const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const fmt=(s,n)=>s.replace('{n}',n);
    const shortTitle=t=>String(t||'').replace(/\s*[:：]\s*.*/,'').replace(/\s*\/\s*[^/]+$/,'').trim();
    function editionLabel(code){return LANGS[lang][code==='zh-Hant'?'zh':code]||code}
    function withLang(path){const u=new URL(path,location.href);u.searchParams.set('lang',LANGS[lang].query);return u.pathname.split('/').pop()+u.search+u.hash}
    function setLanguage(v){lang=norm(v)||'zh-Hant';localStorage.setItem('sustainabilityLang',lang);const u=new URL(location.href);u.searchParams.set('lang',LANGS[lang].query);history.replaceState(null,'',u.pathname+u.search+u.hash);applyStatic();render()}
    function applyStatic(){const u=LANGS[lang];document.documentElement.lang=u.html;document.title=u.docTitle;document.getElementById('backText').textContent=u.back;document.getElementById('backLink').href=withLang('index.html#collection');document.getElementById('pageTitle').textContent=u.title;document.getElementById('pageLead').textContent=u.lead;document.getElementById('search').placeholder=u.search;document.getElementById('empty').textContent=u.empty;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));buildFilters()}
    function buildFilters(){const u=LANGS[lang], box=document.getElementById('filters');const items=[['all',u.all],...zoneOrder.map(k=>[k,u.zones[k][0].replace(/^\d+\s*[｜|]\s*/, '')])];box.innerHTML=items.map(([k,l])=>`<button class="filter ${filter===k?'active':''}" data-filter="${k}">${esc(l)}</button>`).join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;const url=new URL(location.href);filter==='all'?url.searchParams.delete('filter'):url.searchParams.set('filter',filter);history.replaceState(null,'',url.pathname+url.search+url.hash);buildFilters();render()})}
    function metaText(e){const u=LANGS[lang], parts=[];if(e.year)parts.push(e.year);if(e.callNumber)parts.push(`${u.call} ${e.callNumber}`);if(e.location)parts.push(e.location);return parts.join(' · ')}
    function workSearchText(w){return [w.title,...Object.values(w.titles||{}),...w.editions.flatMap(e=>[e.title,e.callNumber,e.location,e.barcode])].filter(Boolean).join(' ').toLowerCase()}
    function render(){const u=LANGS[lang], q=query.trim().toLowerCase();let html='',visible=0;zoneOrder.forEach(zone=>{if(filter!=='all'&&filter!==zone)return;const works=BOOK_WORKS.filter(w=>w.zone===zone&&(!q||workSearchText(w).includes(q)));if(!works.length)return;visible+=works.length;const z=u.zones[zone];html+=`<section class="section"><div class="section-head"><div><div class="section-kicker">${esc(z[0])}</div><h2>${esc(z[0].replace(/^\d+\s*[｜|]\s*/,''))}</h2><p>${esc(z[1])}</p></div><div class="section-total">${esc(fmt(u.works,works.length))}</div></div><div class="grid">${works.map(renderWork).join('')}</div></section>`});content.innerHTML=html;document.getElementById('summaryText').textContent=fmt(u.count,visible);empty.classList.toggle('show',visible===0);bindImages();bindActions()}
    function renderWork(w){const u=LANGS[lang], p=w.editions.find(e=>e.language==='zh-Hant')||w.editions[0];const chips=[...new Set(w.editions.map(e=>editionLabel(e.language)))];const remarks=[];return `<article class="book"><div class="cover-wrap"><div class="cover-fallback">${esc(shortTitle(w.title)||u.cover)}</div>${w.cover?`<img class="cover" src="assets/books/${encodeURIComponent(w.cover)}" alt="${esc(shortTitle(w.title))}" loading="lazy">`:''}</div><h3>${esc(w.title)}</h3><div class="meta-line">${esc(metaText(p))}</div><div class="edition-chips">${chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>${remarks.length?`<div class="remark">${esc(remarks.join(' · '))}</div>`:''}<div class="edition-list">${w.editions.map((e,i)=>renderEdition(e,w.editions.length>1)).join('')}</div></article>`}
    function renderEdition(e,multi){const u=LANGS[lang];const actions=[];if(e.catalogUrl)actions.push(`<button class="action" data-title="${esc(e.title)}" data-url="${esc(e.catalogUrl)}" data-qr="${esc(e.catalogQr||'')}" data-kind="catalog">${esc(u.catalog)}</button>`);if(e.ebookUrl)actions.push(`<button class="action online" data-title="${esc(e.title)}" data-url="${esc(e.ebookUrl)}" data-qr="${esc(e.ebookQr||'')}" data-kind="online">${esc(u.online)}</button>`);return `<div class="edition">${multi?`<div class="edition-name">${esc(editionLabel(e.language))}</div>`:''}<div class="actions ${actions.length===1?'one':''}">${actions.join('')}</div></div>`}
    function bindImages(){document.querySelectorAll('.cover').forEach(img=>{const done=()=>img.parentElement.classList.add('loaded');if(img.complete&&img.naturalWidth)done();else{img.addEventListener('load',done,{once:true});img.addEventListener('error',()=>img.remove(),{once:true})}})}
    const modal=document.getElementById('modal');function closeModal(){modal.classList.remove('show');modal.setAttribute('aria-hidden','true')}
    function bindActions(){content.querySelectorAll('.action').forEach(btn=>btn.onclick=()=>{const u=LANGS[lang], online=btn.dataset.kind==='online';document.getElementById('modalType').textContent=online?u.modalOnline:u.modalCatalog;document.getElementById('modalTitle').textContent=btn.dataset.title;document.getElementById('modalInstruction').textContent=online?u.scanOnline:u.scanCatalog;document.getElementById('modalBody').textContent=u.modalBody;document.getElementById('modalQr').src=btn.dataset.qr;document.getElementById('modalQr').style.display=btn.dataset.qr?'block':'none';document.getElementById('modalOpen').textContent=u.open;document.getElementById('modalOpen').href=btn.dataset.url;document.getElementById('modalUrl').textContent=btn.dataset.url;modal.classList.add('show');modal.setAttribute('aria-hidden','false')})}
    document.getElementById('search').addEventListener('input',e=>{query=e.target.value;render()});document.querySelectorAll('.lang-btn').forEach(b=>b.onclick=()=>setLanguage(b.dataset.lang));document.getElementById('modalClose').onclick=closeModal;modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
    applyStatic();render();
  </script>
</body>
</html>
